# 复制本文件为 benchmark.ini 后使用。
# benchmark.ini 已被 .gitignore 忽略，可以填写本地密钥；不要把真实密钥提交到 GitHub。

[run]
# 可选：aliyun（阿里云）或 vol（字节）。
product = aliyun

# 需要测试的启动规模，逗号分隔；只测部分档位时直接删除其他数字。
rates = 1,10,50,100,200

# 每个档位的持续秒数（统一值）。若配置了 rate_durations，则以 rate_durations 为准。
duration_seconds = 60

# 【可选】各档位单独设置持续秒数，数量必须与 rates 一致，逗号分隔。
# 例如：rates = 1,10,50,100,200 时可设置 rate_durations = 10,30,60,60,60
# 不填则所有档位均使用 duration_seconds。
# rate_durations =

# 【可选】每个档位执行完毕后统一等待的间隔秒数（单个值，对所有档位生效）。
# 例如：rate_interval_seconds = 30 表示每个档位完成后等待 30 秒再开始下一个档位。
# 不填或填 0 则档位之间不设间隔。
# rate_interval_seconds =

storages = none
max_workers = 1000
output = results

# true：每个TPS档位的第1个沙箱不参与mean，但仍参与min/max/P50/P90/P95/P99。
exclude_first_from_mean = true

[product.aliyun]
name = 阿里云
driver = e2b
# 两种方式任选一种：直接填写 api_key，或者留空并通过 api_key_env 指定环境变量。
api_key =
api_key_env = E2B_API_KEY
api_url = https://api.cn-beijing.e2b.fc.aliyuncs.com
domain = cn-beijing.e2b.fc.aliyuncs.com
template = code-interpreter-v1
sandbox_timeout = 300

# 就绪检查方式：command（默认）或 rest。
# command：通过执行沙箱命令检查就绪状态（默认行为）。
# rest：通过向沙箱内服务发送 HTTP GET 请求，等待返回 200 来判断就绪，
#        需同时配置 rest_port 和 rest_path，超时时间为 60 秒，轮询间隔 10ms。
check_type = command
# check_type = rest 时必填：沙箱内服务监听的端口号（正整数）。
rest_port =
# check_type = rest 时可选：HTTP 请求路径，默认 /healthz。
rest_path = /healthz

# 无挂载测试不需要填写下面这些字段。
vpc_config_json =
oss_config_json =
role_arn =
file_metadata_key =
file_config_json =
extra_metadata_json =

[product.vol]
name = 字节
driver = volcengine_native

# 火山原生 SDK 凭证。两种方式任选一种：直接填写 access_key/secret_key，
# 或通过环境变量提供。
access_key =
access_key_env = VOLC_ACCESSKEY
secret_key =
secret_key_env = VOLC_SECRETKEY
region = cn-beijing
function_id =

# 对应 CreateSandboxRequest(timeout=6, timeout_unit="minute")。
sandbox_lifetime = 6
sandbox_lifetime_unit = minute

# 从发起 CreateSandbox 开始等待 Ready 的最大时长和轮询间隔。
ready_timeout_seconds = 120
poll_interval_seconds = 0.1

# 压测时关闭 SDK 隐式自动重试，使一次 trial 对应一次 CreateSandbox 调用。
sdk_auto_retry = false

# 通常留空并使用 SDK 默认 Endpoint；只有火山项目方明确要求时才填写。
endpoint =
